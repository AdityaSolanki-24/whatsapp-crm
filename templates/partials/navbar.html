<nav class="topbar">

      <i class="bi bi-list fs-4"></i>
    </button>
    <nav aria-label="breadcrumb" class="ms-3 d-none d-md-block">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a href="{{ url_for('dashboard.index') }}">Home</a>
        </li>
        {% block breadcrumb %}{% endblock %}

    </nav>
