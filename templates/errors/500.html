{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="error-page text-center py-5">
  <div class="error-code text-danger">500</div>
  <h2 class="mt-3 fw-bold">Internal Server Error</h2>
  <p class="text-muted">Something went wrong on our end. Please try again later.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
    <i class="bi bi-house me-2"></i>Go Home
  </a>
</div>
{% endblock %}
